replicaCount: 1

image:
  repository: tcc-harbor.pea.co.th/operation/vegx/front/prod
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: "latest"

envs:
  - name: TZ
    value: "Asia/Bangkok"
  - name: DB_SERVER
    value: "172.16.104.40"
  - name: DB_PORT
    value: "59356"
  - name: DB_NAME
    value: "VEGETATION"
  - name: DB_USERNAME
    value: "sa"
  - name: DB_PASSWORD
    value: "P%40ssw0rd"  

imagePullSecrets:
  - name: regcred

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: false
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

podAnnotations: {}

